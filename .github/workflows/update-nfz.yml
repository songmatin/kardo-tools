name: Update CAA drone GeoJSON

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch latest GeoJSON
        run: python3 update_geojson.py .
      - name: Commit if changed
        run: |
          git config user.name "kardo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add *.geojson
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: auto-update CAA drone GeoJSON"
            git push
          fi
