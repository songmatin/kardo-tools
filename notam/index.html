<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NOTAM 空域查詢 — Kardo Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#171615;--panel:rgba(28,27,25,.92);--card:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--muted:rgba(255,255,255,.55);--text:rgba(255,255,255,.88);--soft:rgba(255,255,255,.72);--accent:#b8965a;--blue:#50a0ff;--red:#ff4f41;--green:#32d264;--mono:'Courier New',monospace;--sans:'DM Sans',sans-serif;--serif:'Noto Serif TC',serif}
body{min-height:100vh;background:linear-gradient(180deg,rgba(23,22,21,.84),rgba(23,22,21,.96)),url('https://static.wixstatic.com/media/8d236f_563587e32c3d43cda38606d3b57fe249~mv2.jpg') center/cover fixed;color:var(--text);font-family:var(--sans);padding:22px}
a{color:inherit;text-decoration:none}
.shell{max-width:1060px;margin:0 auto}
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.back{border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--muted);font-size:13px;background:rgba(255,255,255,.04)}
.brand{font-family:var(--serif);font-size:26px;letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;backdrop-filter:blur(18px)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin-bottom:12px}
.airport-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.airport{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:13px 14px;transition:.15s}
.airport:hover{border-color:rgba(184,150,90,.55);background:rgba(184,150,90,.11);transform:translateY(-1px)}
.icao{font-family:var(--mono);font-size:17px;color:var(--blue);font-weight:700}
.name{font-size:13px;margin-top:5px}.city{font-size:11px;color:var(--muted);margin-top:2px}
.updated{font-size:12px;color:var(--muted);margin-top:13px;line-height:1.7}
.coord-row{display:flex;gap:8px;margin-bottom:10px}
input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font-size:14px;outline:none}
input:focus{border-color:rgba(184,150,90,.6)}
button{border:none;border-radius:8px;background:var(--accent);color:#111;padding:0 14px;font-weight:700;white-space:nowrap;cursor:pointer}
.hint{color:var(--muted);font-size:12px;line-height:1.8}
.notice{margin-top:16px;padding:12px;border-radius:8px;border:1px solid rgba(80,160,255,.28);background:rgba(80,160,255,.08);font-size:12px;line-height:1.8;color:var(--soft)}
.mini-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mini{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px}
.mini span:first-child{font-family:var(--mono);color:var(--green)}
.mini span:last-child{color:var(--muted)}
@media(max-width:760px){body{padding:14px}.grid{grid-template-columns:1fr}.brand{font-size:22px}.coord-row{flex-direction:column}button{padding:11px 14px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <a class="back" href="../index.html">返回儀表板</a>
    <div>
      <h1 class="brand">NOTAM 空域查詢</h1>
      <div class="sub">選擇機場或飛航情報區，查看無人機相關公告與地圖範圍</div>
    </div>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="label">Airport / FIR</div>
      <div class="airport-grid" id="airport-grid"></div>
      <div class="updated" id="updated">正在讀取最後更新時間...</div>
    </section>

    <aside class="panel">
      <div class="label">座標直接搜尋</div>
      <div class="coord-row">
        <input id="coord-input" placeholder="25.037, 121.517 或 25°02'14.3&quot;N 121°31'01.6&quot;E">
        <button onclick="queryCoord()">查詢 NOTAM</button>
      </div>
      <div class="hint">輸入十進位座標或度分秒座標，系統會帶入地圖頁並比對目前本地 NOTAM 範圍。</div>
      <div class="notice">第一版為本地資料模型與示範資料，用來建立操作流程。正式資料接入前，仍以官方 NOTAM 與飛航服務總臺資料為準。</div>
      <div class="mini-list" id="notice-list"></div>
    </aside>
  </div>
</div>
<script src="notam-data.js?v=20260605-altitude-visibility"></script>
<script>
const data=window.KARDO_NOTAM_DATA;
const currentNotices=data.notices.filter(isCurrentNotice);
const counts=data.airports.reduce((acc,ap)=>{
  acc[ap.icao]=currentNotices.filter(n=>noticeBelongsTo(n,ap.icao)).length;
  return acc;
},{});
const sourceLabel=data.source?.mode==='official-text-import'?'官方原文匯入':data.source?.mode==='public-aggregator'?'公開 NOTAM 聚合':'本地資料模型';
document.getElementById('updated').textContent=`最後更新：${data.updatedAt} · ${sourceLabel}`;
document.getElementById('airport-grid').innerHTML=data.airports.map(ap=>`
  <a class="airport" href="map.html?${ap.icao==='ALL'?'all=1':`icao=${encodeURIComponent(ap.icao)}`}&name=${encodeURIComponent(ap.name)}">
    <div class="icao">${ap.icao}</div>
    <div class="name">${ap.name.replace(ap.icao+' ','')}</div>
    <div class="city">${ap.city} · ${counts[ap.icao] || 0} 筆</div>
  </a>`).join('');
document.getElementById('notice-list').innerHTML=currentNotices.slice(0,4).map(n=>`
  <a class="mini" href="map.html?icao=${encodeURIComponent(n.icao)}&name=${encodeURIComponent(n.icao)}">
    <span>${n.id}</span><span>${n.title}</span>
  </a>`).join('');
function isCurrentNotice(notice){
  return notice.status!=='expired';
}
function noticeBelongsTo(notice,icao){
  if(icao==='ALL') return true;
  if(icao==='RCAA') return notice.fir==='RCAA' || /Q\)\s*RCAA\//.test(notice.raw || '');
  return notice.icao===icao;
}
function parseCoord(input){
  const raw=input.trim();
  const dec=raw.match(/(-?\d+(?:\.\d+)?)\s*[,， ]\s*(-?\d+(?:\.\d+)?)/);
  if(dec) return {lat:parseFloat(dec[1]),lng:parseFloat(dec[2])};
  const dms=raw.match(/(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D*([NS])\s+(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D+(\d+(?:\.\d+)?)\D*([EW])/i);
  if(!dms) return null;
  let lat=+dms[1]+(+dms[2]/60)+(+dms[3]/3600);
  let lng=+dms[5]+(+dms[6]/60)+(+dms[7]/3600);
  if(dms[4].toUpperCase()==='S') lat*=-1;
  if(dms[8].toUpperCase()==='W') lng*=-1;
  return {lat,lng};
}
function queryCoord(){
  const pt=parseCoord(document.getElementById('coord-input').value);
  if(!pt){alert('請輸入有效座標');return;}
  location.href=`map.html?lat=${pt.lat.toFixed(6)}&lng=${pt.lng.toFixed(6)}&name=${encodeURIComponent('座標查詢')}`;
}
</script>
</body>
</html>
