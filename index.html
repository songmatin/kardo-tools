<script>
// ... (前段 CONSTANTS 與 MAP 邏輯維持不變)

// ── 最終優化版 AQI 載入函式 ──
async function fetchAQI() {
  if (!lat || !lng) return;
  
  // 顯示狀態
  const aqiBadge = document.getElementById('aqi-badge');
  const aqiStatus = document.getElementById('aqi-status');
  
  try {
    // 確保 Worker 網址指向正確的環境部 API 轉發
    const url = 'https://cool-dew-3b6d.songmatin-2e5.workers.dev';
    const res = await fetch(url);
    if (!res.ok) throw new Error('伺服器回應異常');
    
    const data = await res.json();
    const records = Array.isArray(data) ? data : data?.records;
    if (!records || !records.length) throw new Error('無測站資料');

    // 尋找距離最近的測站
    let best = null, minD = Infinity;
    records.forEach(r => {
      const rlat = parseFloat(r.latitude), rlng = parseFloat(r.longitude);
      if (isNaN(rlat) || isNaN(rlng)) return;
      
      const d = Math.hypot(rlat - lat, rlng - lng);
      if (d < minD) { minD = d; best = r; }
    });

    if (!best) throw new Error('無法定位最近測站');

    // 安全取值
    const aqi = parseInt(best.aqi) || 0;
    const stn = best.sitename || '未知測站';
    const pm25 = best['pm2.5'] ?? best.pm25 ?? '--';
    
    // 更新 UI
    aqiBadge.textContent = aqi;
    aqiStatus.textContent = aqi <= 50 ? '良好' : aqi <= 100 ? '普通' : '不健康';
    document.getElementById('aqi-station').textContent = `測站：${stn}`;
    document.getElementById('aqi-pm25').innerHTML = `${pm25}<span class="card-unit">μg</span>`;
    
  } catch(e) {
    console.error('AQI 載入失敗:', e);
    aqiStatus.textContent = '載入失敗';
  }
}

// ── 確保定位完成後才執行 fetchWeather ──
window.addEventListener('load', ()=>{
  ldStatus('初始化...');
  initMap();
  buildAirportTabs();
  renderNotams();
  // 延遲執行確保 map 載入完畢
  setTimeout(locate, 500); 
});
</script>
</body>
